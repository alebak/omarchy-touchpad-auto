<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Touchpad: surface, button strip, and the divider between the two
       buttons. The divider is what makes the shape read as a touchpad
       rather than a drive or a folder. Stroke only, no background, so it
       sits on any notification theme. -->
  <g fill="none" stroke="#8a8a8a" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
    <rect x="2.1" y="4.6" width="19.8" height="14.8" rx="2.4"/>
    <line x1="2.1" y1="15.1" x2="21.9" y2="15.1"/>
    <line x1="12" y1="15.1" x2="12" y2="19.4"/>
  </g>
</svg>
